<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="50%" stop-color="#f7a602"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#f7a602" stroke-width="1.8" stroke-opacity="0.8"/>

  <!-- Sun Glow & Radiant Disc -->
  <circle cx="44" cy="20" r="14" fill="#f7a602" opacity="0.3" filter="url(#glow)"/>
  <circle cx="44" cy="20" r="10" fill="url(#sunGrad)"/>

  <!-- Sun Rays -->
  <path d="M44 6 L44 8 M44 32 L44 34 M30 20 L32 20 M56 20 L58 20 M34 10 L35.5 11.5 M52.5 28.5 L54 30 M34 30 L35.5 28.5 M52.5 11.5 L54 10" 
        stroke="#ffd54f" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Solar Photovoltaic Panel Array (Isometric Perspective) -->
  <polygon points="10,50 28,33 54,33 36,50" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.4"/>
  
  <!-- Perspective Grid Cells -->
  <line x1="19" y1="41.5" x2="45" y2="41.5" stroke="#7dd3fc" stroke-width="1" opacity="0.8"/>
  <line x1="23" y1="50" x2="37" y2="33" stroke="#7dd3fc" stroke-width="1" opacity="0.8"/>
  <line x1="30" y1="50" x2="46" y2="33" stroke="#7dd3fc" stroke-width="1" opacity="0.8"/>

  <!-- Surface Light Specular Glare -->
  <polygon points="12,49 27,34.5 35,34.5 18,49" fill="#ffffff" opacity="0.25"/>

  <!-- Solar Energy Star Sparkle -->
  <polygon points="30,33 32,27 34,31 39,32 35,35 34,40 31,36 26,36" fill="#ffffff" opacity="0.9"/>
</svg>